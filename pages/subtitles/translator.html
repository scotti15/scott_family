<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Subtitle Translator (LibreTranslate)</title>
<style>
body { font-family: Arial; margin: 40px; }
#log { white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; height: 250px; overflow-y: auto; }
</style>
</head>
<body>

<h2>Subtitle Translator (LibreTranslate)</h2>

<input type="file" id="fileInput" accept=".srt"><br><br>

<label>Target language:</label>
<select id="targetLang">
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
  <option value="it">Italian</option>
  <option value="pt">Portuguese</option>
  <option value="ru">Russian</option>
  <option value="ja">Japanese</option>
  <option value="zh">Chinese</option>
</select>

<br><br>
<button onclick="startTranslation()">Translate</button>

<h3>Log</h3>
<div id="log"></div>

<script>
function log(msg) {
    document.getElementById("log").textContent += msg + "\n";
}

function parseSRT(content) {
    const blocks = [];
    const raw = content.split(/\r?\n\r?\n/);

    for (let chunk of raw) {
        const lines = chunk.split(/\r?\n/);
        if (lines.length >= 3) {
            const index = lines[0].trim();
            const time = lines[1].trim();
            const text = lines.slice(2).join("\n");
            blocks.push({ index, time, text });
        }
    }
    return blocks;
}

function rebuildSRT(blocks) {
    return blocks.map(b =>
        `${b.index}\n${b.time}\n${b.text}\n`
    ).join("\n");
}

async function translateBatch(blocks, target) {
    const joined = blocks.map(b => b.text).join("\n@@BLOCK@@\n");

    const res = await fetch("https://translate.argosopentech.com/translate", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            q: joined,
            source: "auto",
            target: target,
            format: "text"
        })
    });

    if (!res.ok) {
        throw new Error("Server returned " + res.status);
    }

    const data = await res.json();

    if (!data.translatedText) {
        throw new Error("Translation failed or rate-limited.");
    }

    return data.translatedText.split("\n@@BLOCK@@\n");
}

async function startTranslation() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
        log("No file selected.");
        return;
    }

    const target = document.getElementById("targetLang").value;

    const content = await file.text();
    const blocks = parseSRT(content);

    log(`Loaded ${blocks.length} blocks.`);

    const batchSize = 100;

    for (let i = 0; i < blocks.length; i += batchSize) {
        const slice = blocks.slice(i, i + batchSize);

        log(`Translating blocks ${i+1} to ${Math.min(i+batchSize, blocks.length)}...`);

        let translated;
        try {
            translated = await translateBatch(slice, target);
        } catch (err) {
            log("Error: " + err.message);
            return;
        }

        for (let j = 0; j < translated.length; j++) {
            blocks[i + j].text = translated[j];
        }
    }

    const output = rebuildSRT(blocks);

    const blob = new Blob([output], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = file.name.replace(".srt", "") + ".translated.srt";
    a.click();

    log("Translation complete.");
}
</script>

</body>
</html>
