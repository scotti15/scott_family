<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Geo Quiz — Stacked</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Countries and Capitals Quiz</h1>
      <p class="subtitle">Choose a region, name the highlighted area. Stacked layout.</p>
    </header>

    <section id="map-area" class="map-area">
      <div id="map-wrapper" class="map-wrapper">
        <!-- SVG will be loaded here -->
        <div id="map-placeholder">Loading map…</div>
      </div>


      <div class="controls">
        <label for="region-select">Region</label>
        <select id="region-select"></select>
        <div id="quiz-mode">
          <label>
            <input type="radio" name="mode" value="region" checked />
            Region Name
          </label>
          <label>
            <input type="radio" name="mode" value="capital" />
            Capital City
          </label>
        </div>

        <div class="game-stats">
          <div>Time: <span id="time">0</span>s</div>
          <div>Score: <span id="score">0</span></div>
          <div>Remaining: <span id="remaining">0</span></div>
        </div>

        <label for="guess-input">Type the name and press Enter</label>
        <div class="autocomplete-wrapper">
          <input id="guess-input" autocomplete="off" placeholder="Start typing..." />
          <div id="suggestions" class="suggestions" aria-hidden="true"></div>
        </div>

        <div class="buttons">
          <button id="submit-btn">Submit</button>
          <button id="skip-btn">Skip (penalty)</button>
          <button id="reset-btn">Reset</button>
        </div>

        <div id="message" class="message"></div>
        
      </div>
    </section>

    <footer class="footer">
      <small></small>
    </footer>
  </main>
  
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.7.1/dist/svg-pan-zoom.min.js"></script>

  <script src="js/regions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
