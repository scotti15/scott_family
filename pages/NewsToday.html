<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Archive Links</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #1e1e1e;
        color: #e0e0e0;
        line-height: 1.6;
    }
    h1 {
        margin-bottom: 10px;
        font-size: 2em;
        color: #ffffff;
    }
    .timestamp {
        margin-bottom: 20px;
        font-size: 0.9em;
        color: #bbbbbb;
    }
    .controls {
        margin-bottom: 25px;
        display: flex;
        gap: 10px;
    }
    .controls button {
        padding: 8px 14px;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95em;
    }
    .controls button:hover {
        background: #444;
    }
    .group {
        margin-top: 30px;
    }
    .group h2 {
        margin-bottom: 10px;
        color: #ffffff;
        border-bottom: 1px solid #444;
        padding-bottom: 4px;
    }
    .link-card {
        background: #2a2a2a;
        padding: 12px 16px;
        margin: 8px 0;
        border-radius: 8px;
        transition: background 0.2s;
    }
    .link-card:hover {
        background: #333;
    }
    .link-card a {
        color: #4da3ff;
        font-size: 1.15em;
        text-decoration: none;
    }
    .link-card a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<h1>Daily Archive Links</h1>
<div class="timestamp" id="timestamp"></div>

<div class="controls">
    <button id="btn-yesterday">Yesterday</button>
    <button id="btn-today">Today</button>
    <button id="btn-tomorrow">Tomorrow</button>

    <input type="date" id="datePicker" style="
        padding: 8px 10px;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        font-size: 0.95em;
    ">
</div>


<div id="content"></div>

<script>
let offset = 0;

function buildPage() {
    const now = new Date();
    now.setDate(now.getDate() + offset);

    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const yyyymmdd = yyyy + mm + dd;

    document.getElementById("timestamp").textContent =
        "Showing links for " + yyyy + "-" + mm + "-" + dd;

    const shows = [
        { name: "Money, Power, Politics", channel: "MSNOW", time: "130000", show: "Money_Power_Politics_With_Stephanie_Ruhle" },
        { name: "The Moment", channel: "MSNOW", time: "180000", show: "The_Moment_With_Katy_Tur" },
        { name: "On The Line", channel: "MSNOW", time: "160000", show: "On_the_Line_With_Alicia_Menendez" },
        { name: "Morning Joe", channel: "MSNOW", time: "100000", show: "Morning_Joe" },
        { name: "The Arena", channel: "CNNW", time: "200000", show: "The_Arena_With_Kasie_Hunt" },
        { name: "CNN News Central (Hour 1)", channel: "CNNW", time: "110000", show: "CNN_News_Central" },
		{ name: "CNN News Central (Hour 2)", channel: "CNNW", time: "120000", show: "CNN_News_Central" },
		{ name: "CNN News Central (Hour 3)", channel: "CNNW", time: "130000", show: "CNN_News_Central" },
        { name: "Squawk Box", channel: "CNBC", time: "100000", show: "Squawk_Box" }
    ];

    const networks = {
        MSNOW: "MSNBC",
        CNNW: "CNN",
        CNBC: "CNBC"
    };

    const container = document.getElementById("content");
    container.innerHTML = "";

    const grouped = {};
    shows.forEach(s => {
        if (!grouped[s.channel]) grouped[s.channel] = [];
        grouped[s.channel].push(s);
    });

    for (const channel in grouped) {
        const groupDiv = document.createElement("div");
        groupDiv.className = "group";

        const header = document.createElement("h2");
        header.textContent = networks[channel];
        groupDiv.appendChild(header);

        grouped[channel].forEach(s => {
            const url = "https://archive.org/details/" +
                s.channel + "_" + yyyymmdd + "_" + s.time + "_" + s.show;

            const card = document.createElement("div");
            card.className = "link-card";

            const a = document.createElement("a");
            a.href = url;
            a.target = "_blank";
            a.textContent = s.name;

            card.appendChild(a);
            groupDiv.appendChild(card);
        });

        container.appendChild(groupDiv);
    }
}

document.getElementById("btn-yesterday").addEventListener("click", () => {
    offset = -1;
    buildPage();
});

document.getElementById("btn-today").addEventListener("click", () => {
    offset = 0;
    buildPage();
});

document.getElementById("btn-tomorrow").addEventListener("click", () => {
    offset = 1;
    buildPage();
});
document.getElementById("datePicker").addEventListener("change", (e) => {
    const [y, m, d] = e.target.value.split("-").map(Number);

    // Picked date in UTC days
    const pickedUTC = Date.UTC(y, m - 1, d);

    // Today in UTC days
    const todayObj = new Date();
    const todayUTC = Date.UTC(
        todayObj.getFullYear(),
        todayObj.getMonth(),
        todayObj.getDate()
    );

    const diff = (pickedUTC - todayUTC) / 86400000; // ms → days
    offset = diff;

    buildPage();
});

buildPage();
</script>

</body>
</html>
